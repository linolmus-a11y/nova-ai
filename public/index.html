<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>NOVA 5.2</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f4f5;color:#18181b}
main{max-width:900px;margin:auto;padding:16px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:16px;margin:12px 0}
textarea{width:100%;min-height:90px;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:12px}
button{padding:12px 16px;border:1px solid #ccc;border-radius:12px;background:#fff}
.msg{padding:12px;margin:8px 0;border-radius:12px;white-space:pre-wrap}
.user{background:#eef2ff}.assistant{background:#eee}
</style>
</head>
<body><main>
<h1>NOVA 5.2</h1>
<div class="card"><b>Ollama:</b> <span id="status">проверка...</span><div id="models"></div></div>
<div class="card"><div id="chat"></div><textarea id="input" placeholder="Напиши сообщение..."></textarea><br><br><button onclick="send()">Отправить</button> <button onclick="test()">Тест Ollama</button></div>
<script>
const $=s=>document.querySelector(s);
function add(c,t){let d=document.createElement("div");d.className="msg "+c;d.textContent=t;$("#chat").appendChild(d)}
async function load(){try{let j=await fetch("/api/local/models").then(r=>r.json());if(!j.ok)throw Error(j.error);$("#status").textContent="🟢 доступна · "+j.activeModel;$("#models").textContent="Модели: "+j.models.map(x=>x.name).join(", ")}catch(e){$("#status").textContent="🔴 "+e.message}}
async function send(){let m=$("#input").value.trim();if(!m)return;$("#input").value="";add("user",m);let j=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m})}).then(r=>r.json());add("assistant",j.ok?j.response+"\n\n"+j.source:"Ошибка: "+j.error)}
async function test(){let j=await fetch("/api/local/test",{method:"POST"}).then(r=>r.json());add("assistant",j.ok?j.response:"Ошибка Ollama: "+j.error);load()}
load();
</script></main></body></html>
