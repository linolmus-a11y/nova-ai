<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#090909">
  <title>NOVA 5.3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #090909;
      color: #f2f2f2;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: manipulation;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    .app {
      display: flex;
      width: 100%;
      height: 100vh;
      min-height: 100vh;
      background: #090909;
    }

    /* SIDEBAR */

    .sidebar {
      width: 250px;
      flex: 0 0 250px;
      background: #111;
      border-right: 1px solid #242424;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 14px 10px;
    }

    .logo {
      padding: 10px 12px 18px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .version {
      display: inline-block;
      margin-left: 6px;
      color: #888;
      font-size: 11px;
      font-weight: 400;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .nav button {
      width: 100%;
      text-align: left;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #aaa;
      padding: 11px 12px;
      font-size: 14px;
    }

    .nav button:hover,
    .nav button.active {
      background: #1c1c1c;
      color: #fff;
    }

    .stop {
      margin-top: auto;
      padding-top: 15px;
    }

    .stop button {
      width: 100%;
      border: 1px solid #5a1717;
      background: #260d0d;
      color: #ff5b5b;
      border-radius: 8px;
      padding: 12px;
      font-weight: 700;
    }

    .runtime {
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 8px;
      background: #151515;
      color: #aaa;
      font-size: 12px;
    }

    .online {
      color: #54d477;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: #0b0b0b;
    }

    .topbar {
      height: 58px;
      flex: 0 0 58px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #0e0e0e;
    }

    .top-title {
      font-size: 16px;
      font-weight: 700;
    }

    .status {
      font-size: 12px;
      color: #888;
    }

    .workspace {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px;
    }

    .hero {
      max-width: 1000px;
      margin: 0 auto 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    .hero p {
      margin: 0;
      color: #888;
      line-height: 1.5;
    }

    /* CARDS */

    .cards {
      max-width: 1000px;
      margin: 0 auto 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      background: #121212;
      border: 1px solid #242424;
      border-radius: 12px;
      padding: 16px;
      min-height: 110px;
    }

    .card-title {
      color: #888;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
    }

    /* CHAT */

    .chat {
      max-width: 1000px;
      margin: 0 auto;
      border: 1px solid #242424;
      border-radius: 12px;
      background: #101010;
      overflow: hidden;
    }

    .messages {
      min-height: 280px;
      max-height: 480px;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      max-width: 85%;
      margin-bottom: 12px;
      padding: 11px 13px;
      border-radius: 10px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      margin-left: auto;
      background: #202020;
    }

    .message.nova {
      background: #161616;
      border: 1px solid #242424;
    }

    .composer {
      border-top: 1px solid #242424;
      padding: 12px;
      display: flex;
      gap: 8px;
    }

    .composer textarea {
      flex: 1;
      min-height: 48px;
      max-height: 140px;
      resize: vertical;
      border: 1px solid #2b2b2b;
      background: #0b0b0b;
      color: #fff;
      border-radius: 9px;
      padding: 12px;
      outline: none;
    }

    .composer textarea:focus {
      border-color: #444;
    }

    .send {
      min-width: 90px;
      border: 1px solid #333;
      background: #1c1c1c;
      color: #fff;
      border-radius: 9px;
      padding: 0 15px;
      font-weight: 700;
    }

    .send:hover {
      background: #252525;
    }

    /* ATTACHMENTS */

    .attachments {
      max-width: 1000px;
      margin: 14px auto 0;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .attach {
      position: relative;
      border: 1px solid #2a2a2a;
      background: #151515;
      color: #ccc;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .attach:hover {
      background: #1d1d1d;
    }

    .attach input {
      display: none;
    }

    .file-info {
      width: 100%;
      color: #777;
      font-size: 12px;
      min-height: 18px;
    }

    /* MOBILE */

    @media (max-width: 800px) {
      .sidebar {
        width: 205px;
        flex-basis: 205px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .workspace {
        padding: 14px;
      }

      .hero h1 {
        font-size: 23px;
      }
    }

    @media (max-width: 600px) {
      body {
        overflow: hidden;
      }

      .app {
        display: block;
      }

      .sidebar {
        position: fixed;
        z-index: 20;
        left: 0;
        top: 0;
        bottom: 0;
        width: 250px;
        transform: translateX(-100%);
        transition: transform .2s ease;
        box-shadow: 10px 0 30px rgba(0,0,0,.35);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        width: 100%;
        height: 100vh;
      }

      .topbar {
        padding: 0 12px;
      }

      .menu-toggle {
        display: block;
        border: 1px solid #2a2a2a;
        background: #151515;
        color: #fff;
        border-radius: 7px;
        padding: 7px 10px;
        margin-right: 9px;
      }

      .top-left {
        display: flex;
        align-items: center;
      }

      .workspace {
        padding: 12px;
      }

      .chat {
        border-radius: 10px;
      }

      .messages {
        min-height: 300px;
        max-height: none;
      }

      .composer {
        padding: 8px;
      }

      .send {
        min-width: 70px;
      }

      .message {
        max-width: 92%;
      }
    }

    @media (min-width: 601px) {
      .menu-toggle {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">
      <div class="logo">
        NOVA
        <span class="version">5.3</span>
      </div>

      <nav class="nav">
        <button class="active">Chat</button>
        <button>Agent</button>
        <button>Tasks</button>
        <button>Workflow</button>
        <button>Search</button>
        <button>Files</button>
        <button>Projects</button>
        <button>Knowledge</button>
        <button>Code</button>
        <button>Computer</button>
        <button>Vision</button>
        <button>Extensions</button>
        <button>Voice</button>
        <button>Images</button>
        <button>NOVA Lab</button>
        <button>Monitor</button>
        <button>Audit Log</button>
        <button>Security</button>
        <button>Privacy</button>
        <button>Backup</button>
        <button>Diagnostics</button>
        <button>Settings</button>
      </nav>

      <div class="stop">
        <button id="stopButton">GLOBAL STOP</button>
      </div>

      <div class="runtime">
        Runtime:
        <span class="online">ONLINE</span>
      </div>
    </aside>

    <main class="main">

      <header class="topbar">
        <div class="top-left">
          <button class="menu-toggle" id="menuToggle">☰</button>
          <div class="top-title">NOVA 5.3</div>
        </div>

        <div class="status" id="status">
          Local AI
        </div>
      </header>

      <section class="workspace">

        <div class="hero">
          <h1>AI Assistant</h1>
          <p>
            NOVA 5.3 · Local AI · Ollama · Mobile UX · Media foundation
          </p>
        </div>

        <div class="cards">

          <div class="card">
            <div class="card-title">LOCAL AI</div>
            <div class="card-value" id="localStatus">
              checking...
            </div>
          </div>

          <div class="card">
            <div class="card-title">MODEL</div>
            <div class="card-value" id="modelName">
              qwen2.5:3b
            </div>
          </div>

          <div class="card">
            <div class="card-title">VERSION</div>
            <div class="card-value">
              NOVA 5.3.0
            </div>
          </div>

        </div>

        <div class="chat">

          <div class="messages" id="messages">
            <div class="message nova">
              NOVA 5.3 готова. Локальный AI подключается через Ollama.
            </div>
          </div>

          <div class="composer">
            <textarea
              id="messageInput"
              placeholder="Напишите сообщение..."
              autocomplete="off"
            ></textarea>

            <button class="send" id="sendButton">
              Отправить
            </button>
          </div>

        </div>

        <div class="attachments">

          <label class="attach">
            📷 Фото
            <input
              type="file"
              id="photoInput"
              accept="image/*"
            >
          </label>

          <label class="attach">
            🎥 Видео
            <input
              type="file"
              id="videoInput"
              accept="video/*"
            >
          </label>

          <div class="file-info" id="fileInfo"></div>

        </div>

      </section>
    </main>
  </div>

  <script>
    const sidebar = document.getElementById("sidebar");
    const menuToggle = document.getElementById("menuToggle");

    menuToggle?.addEventListener("click", () => {
      sidebar.classList.toggle("open");
    });

    document.querySelectorAll(".nav button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".nav button")
          .forEach(b => b.classList.remove("active"));

        button.classList.add("active");

        if (window.innerWidth <= 600) {
          sidebar.classList.remove("open");
        }
      });
    });

    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      sendButton.disabled = true;

      const thinking = addMessage("NOVA думает...", "nova");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message
          })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || "Ошибка AI");
        }

        thinking.textContent = data.response || "Пустой ответ";

        if (data.source) {
          document.getElementById("status").textContent = data.source;
        }

      } catch (error) {
        thinking.textContent =
          "Ошибка: " + error.message;
      } finally {
        sendButton.disabled = false;
        input.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", event => {
      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {
        event.preventDefault();
        sendMessage();
      }
    });

    async function checkLocalAI() {
      try {
        const response = await fetch("/api/providers");
        const data = await response.json();

        if (data.ok) {
          document.getElementById("localStatus")
            .textContent =
            data.providers?.local?.status || "AVAILABLE";

          document.getElementById("modelName")
            .textContent =
            data.models?.local || "qwen2.5:3b";
        }
      } catch {
        document.getElementById("localStatus")
          .textContent = "OFFLINE";
      }
    }

    document.getElementById("photoInput")
      .addEventListener("change", event => {
        const file = event.target.files?.[0];

        if (!file) return;

        document.getElementById("fileInfo").textContent =
          `Фото: ${file.name} · ${formatSize(file.size)}`;
      });

    document.getElementById("videoInput")
      .addEventListener("change", event => {
        const file = event.target.files?.[0];

        if (!file) return;

        document.getElementById("fileInfo").textContent =
          `Видео: ${file.name} · ${formatSize(file.size)}`;
      });

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " KB";

      return (bytes / 1024 / 1024).toFixed(1) + " MB";
    }

    document.getElementById("stopButton")
      .addEventListener("click", () => {
        input.disabled = true;
        sendButton.disabled = true;

        addMessage(
          "GLOBAL STOP активирован.",
          "nova"
        );
      });

    checkLocalAI();
  </script>
</body>
</html>
